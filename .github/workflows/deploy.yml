name: Deploy CS231n Tutorial Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify notebooks directory
        run: |
          echo "=== Notebooks found ==="
          find ../notebooks/ -name "*.ipynb" | head -20
          echo "=== Total ==="
          find ../notebooks/ -name "*.ipynb" | wc -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy notebook assets to docs
        run: |
          mkdir -p ../docs/notebooks
          cp -r ../notebooks/* ../docs/notebooks/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          force_orphan: true
